# Builds, tests and packages the DEBUG Android APK (for testing only — never distribute it as a release).
# Output artifact: "student-flatmate-android-debug" containing app-debug.apk + app-debug.apk.sha256
name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/student-flatmate-finder
      - feature/flatmates-premium-upgrade
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

# Least privilege: this workflow only reads the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_PLATFORM: "android-35"

jobs:
  build:
    name: Build, test & package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" > /dev/null
          echo "Installed: ${ANDROID_PLATFORM}, build-tools ${ANDROID_BUILD_TOOLS}"

      - name: Unit tests, lint and assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            -Pflatmates.versionCode="${{ github.run_number }}" \
            testDebugUnitTest lintDebug assembleDebug 2>&1 | tee "${RUNNER_TEMP}/gradle-build.log"

      - name: Verify APK exists and create SHA-256 checksum
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/debug
          APK="$DIR/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Expected debug APK not found at android/$APK"
            ls -R app/build/outputs || true
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify "$APK"
          ( cd "$DIR" && sha256sum app-debug.apk > app-debug.apk.sha256 )
          SHA=$(cut -d' ' -f1 "$DIR/app-debug.apk.sha256")
          SIZE=$(stat -c %s "$APK")
          {
            echo "### Debug APK built"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`app-debug.apk\` ($(( SIZE / 1024 )) KB) |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Artifact | \`student-flatmate-android-debug\` |"
            echo ""
            echo "_Debug build for testing only — it is not a release and must not be published._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: student-flatmate-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log, test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-reports
          path: |
            ${{ runner.temp }}/gradle-build.log
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  device-smoke:
    name: Install & launch on emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: android/scripts

      - name: Download debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: student-flatmate-android-debug
          path: apk

      - name: Verify downloaded checksum
        working-directory: apk
        run: sha256sum -c app-debug.apk.sha256

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/scripts/device-smoke.sh apk/app-debug.apk in.noidarankers.flatmates.debug flatmates.noidarankers.in smoke

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-smoke
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
