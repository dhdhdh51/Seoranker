# Builds a SIGNED release APK and publishes it to a GitHub Release.
#
# Triggers (never runs for pull requests):
#   • push a tag named  flatmates-android-vX.Y.Z   (e.g. flatmates-android-v1.0.0)
#   • manual "Run workflow" with a version (creates that tag on the selected commit)
#
# Signing material lives ONLY in the protected "android-release" environment secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See docs/ANDROID.md for how to create them.
name: Android release APK

on:
  push:
    tags:
      - "flatmates-android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z). Creates tag flatmates-android-vX.Y.Z on the selected commit."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_PLATFORM: "android-35"

jobs:
  release:
    name: Build, sign & publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: write # create the GitHub Release
    defaults:
      run:
        working-directory: android
    steps:
      - name: Resolve version
        id: v
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="${REF_NAME#flatmates-android-v}"; fi
          if [[ ! "$V" =~ ^([0-9]{1,2})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$V')"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=flatmates-android-v$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V (versionCode $CODE)"

      - name: Check signing secrets are configured
        working-directory: .
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ]  || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KP" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets missing:$missing. Nothing was built or published. See docs/ANDROID.md."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle (read-only cache for releases)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" > /dev/null

      - name: Restore keystore from secret
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KS" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and signed release build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon \
            -Pflatmates.versionName="${{ steps.v.outputs.version }}" \
            -Pflatmates.versionCode="${{ steps.v.outputs.code }}" \
            testReleaseUnitTest assembleRelease 2>&1 | tee "${RUNNER_TEMP}/gradle-release.log"

      - name: Verify signed APK, checksum and certificate
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -s "$SRC" ]; then echo "::error::Signed release APK not found at android/$SRC"; ls -R app/build/outputs || true; exit 1; fi
          BT="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          "$BT/apksigner" verify --verbose "$SRC" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          CERTS=$("$BT/apksigner" verify --print-certs "$SRC")
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then echo "::error::Release APK is signed with a debug key"; exit 1; fi
          if "$BT/aapt2" dump badging "$SRC" | grep -q "application-debuggable"; then echo "::error::Release APK is debuggable"; exit 1; fi
          NAME="student-flatmate-finder-${{ steps.v.outputs.version }}.apk"
          mkdir -p "${RUNNER_TEMP}/dist"
          cp "$SRC" "${RUNNER_TEMP}/dist/$NAME"
          ( cd "${RUNNER_TEMP}/dist" && sha256sum "$NAME" > "$NAME.sha256" )
          SHA=$(cut -d' ' -f1 "${RUNNER_TEMP}/dist/$NAME.sha256")
          CERT_SHA=$(echo "$CERTS" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT_SHA" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA"
          echo "Signing certificate SHA-256: $CERT_SHA"

      - name: Write release notes
        env:
          V: ${{ steps.v.outputs.version }}
          NAME: ${{ steps.apk.outputs.name }}
          SHA: ${{ steps.apk.outputs.sha }}
          CERT: ${{ steps.apk.outputs.cert }}
        run: |
          cat > "${RUNNER_TEMP}/notes.md" <<NOTES
          ## Student Flatmate Finder for Android — v${V}

          Official signed Android app for https://flatmates.noidarankers.in — same account, matches, chats and privacy protections as the website.

          ### Install
          1. On your Android phone (Android 7.0+), download **${NAME}** below.
          2. Open the downloaded file. If Android asks, allow your browser to *install unknown apps* for this install (you can turn it off again afterwards). You never need to disable Google Play Protect.
          3. Tap **Install**, open the app and sign in with your usual account.

          Only install this app from this page or from https://flatmates.noidarankers.in/app.

          ### Verify the download (optional)
          - APK SHA-256: \`${SHA}\`
          - Signing certificate SHA-256: \`${CERT}\`

          Built by GitHub Actions run ${{ github.run_id }} from commit ${{ github.sha }}.
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          V: ${{ steps.v.outputs.version }}
          EVENT: ${{ github.event_name }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version instead of overwriting a published release."; exit 1
          fi
          EXTRA=""
          if [ "$EVENT" = "push" ]; then EXTRA="--verify-tag"; else EXTRA="--target $GITHUB_SHA"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $EXTRA \
            --title "Student Flatmate Finder Android v$V" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${RUNNER_TEMP}/dist/$NAME" "${RUNNER_TEMP}/dist/$NAME.sha256"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          {
            echo "### Published v$V"
            echo "- APK: $URL"
            echo "- SHA-256: \`${{ steps.apk.outputs.sha }}\`"
            echo "- Signing cert SHA-256 (for App Links): \`${{ steps.apk.outputs.cert }}\`"
            echo ""
            echo "Set these in the website: Admin → Settings → Android app."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-build-log
          path: |
            ${{ runner.temp }}/gradle-release.log
            android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove keystore
        if: always()
        working-directory: .
        run: rm -f "${RUNNER_TEMP}/release.jks"
