# ---- App configuration (override per build with -Pflatmates.xxx=... ) ----
# Production website the app wraps. Must be https:// and end with a slash.
flatmates.baseUrl=https://flatmates.noidarankers.in/
# Reverse-domain application ID. Changing it after release creates a different app.
flatmates.applicationId=in.noidarankers.flatmates
# Version (CI overrides these from the release tag / run number)
flatmates.versionName=1.0.0
flatmates.versionCode=1

# ---- Gradle / Android ----
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
